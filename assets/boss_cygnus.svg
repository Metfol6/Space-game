<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="cygnusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetCygnus" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="85%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="#030712"/>
  <!-- Space Stars -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="45" cy="40" r="1"/><circle cx="120" cy="90" r="1.5"/><circle cx="530" cy="50" r="1.2"/><circle cx="480" cy="120" r="1"/>
    <circle cx="80" cy="280" r="1.2"/><circle cx="540" cy="300" r="1.5"/><circle cx="200" cy="30" r="1"/><circle cx="380" cy="330" r="1"/>
  </g>
  <!-- Background Nebula Glow -->
  <circle cx="300" cy="180" r="180" fill="url(#cygnusGlow)"/>
  
  <!-- Outer Defense Satellite Track -->
  <ellipse cx="300" cy="180" rx="240" ry="85" fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" stroke-dasharray="6,6"/>
  
  <!-- Orbital Ring Structure (Back) -->
  <ellipse cx="300" cy="180" rx="190" ry="55" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  
  <!-- Cygnus Planet Core -->
  <circle cx="300" cy="180" r="95" fill="url(#planetCygnus)"/>
  
  <!-- Precursor Trench Grid & Glow -->
  <path d="M 230 150 Q 300 170 370 150" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.8"/>
  <path d="M 220 180 Q 300 200 380 180" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.9"/>
  <path d="M 240 210 Q 300 225 360 210" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.8"/>
  
  <!-- Orbital Ring Structure (Front overlay) -->
  <path d="M 110 180 A 190 55 0 0 0 490 180" fill="none" stroke="url(#ringGrad)" stroke-width="5"/>
  
  <!-- Defensive Bastion Fortresses (Nodes) -->
  <g fill="#22d3ee" stroke="#083344" stroke-width="2">
    <rect x="100" y="172" width="16" height="16" rx="3"/>
    <rect x="484" y="172" width="16" height="16" rx="3"/>
    <rect x="292" y="227" width="16" height="16" rx="3"/>
  </g>
  <!-- Title Badge in SVG -->
  <text x="300" y="325" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">CYGNUS BASTION // ŐSI PREKURZOR ELŐŐRS</text>
  <text x="300" y="345" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">ENDGAME TIER 3 CITADELLA • KVANTUM REZGŐPAJZS</text>
</svg>