<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.22"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070d1a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <rect x="25" y="25" width="1230" height="670" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="25" y1="65" x2="1255" y2="65" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="25" y1="655" x2="1255" y2="655" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>

  <text x="45" y="52" fill="#00f3ff" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="3">IMPERIAL LOGISTICS CAD SCHEMATIC // SIDE ELEVATION</text>
  <text x="960" y="52" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="1">CLASS: HEAVY FREIGHTER MK.VI</text>
  <text x="45" y="680" fill="#94a3b8" font-family="monospace" font-size="12">SCALE: 1:100 | SYS_SPEC: 4 SLOTS | BULK_TRANSPORT & SALVAGE | SPEED: 4.0/H</text>
  <text x="1080" y="680" fill="#00f3ff" font-family="monospace" font-size="12">STATUS: LOGISTICS-ACTIVE</text>

  
  <g transform="translate(160, 150)" stroke="#e0f2fe" stroke-width="2" fill="none" filter="url(#neonGlow)">
    <polygon points="80,140 220,130 780,130 840,160 880,210 880,260 840,290 780,310 220,310 80,300" stroke="#38bdf8" stroke-width="2.5" fill="#08182b" fill-opacity="0.7"/>
    <rect x="240" y="145" width="140" height="150" rx="6" stroke="#00f3ff" stroke-width="2" fill="#0369a1" fill-opacity="0.4"/>
    <rect x="410" y="145" width="140" height="150" rx="6" stroke="#00f3ff" stroke-width="2" fill="#0369a1" fill-opacity="0.4"/>
    <rect x="580" y="145" width="140" height="150" rx="6" stroke="#00f3ff" stroke-width="2" fill="#0369a1" fill-opacity="0.4"/>
    <line x1="240" y1="220" x2="380" y2="220" stroke="#38bdf8" stroke-width="1"/>
    <line x1="410" y1="220" x2="550" y2="220" stroke="#38bdf8" stroke-width="1"/>
    <line x1="580" y1="220" x2="720" y2="220" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="750,130 820,130 850,160 760,160" stroke="#00f3ff" stroke-width="2" fill="#0284c7" fill-opacity="0.5"/>
    <circle cx="860" cy="235" r="14" stroke="#00f3ff" stroke-width="2" fill="#075985"/>
    <line x1="874" y1="235" x2="910" y2="235" stroke="#00f3ff" stroke-width="2"/>
    <rect x="40" y="150" width="70" height="55" rx="4" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <rect x="40" y="235" width="70" height="55" rx="4" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <polygon points="40,160 0,177 40,195" fill="url(#glowCyan)" stroke="none"/>
    <polygon points="40,245 0,262 40,280" fill="url(#glowCyan)" stroke="none"/>
  </g>

  
  <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" font-family="monospace" font-size="11" fill="#7dd3fc">
    <line x1="1020" y1="385" x2="1120" y2="385"/>
    <text x="1010" y="370">WEAPON: DEFENSE TURRET</text>
    <line x1="580" y1="220" x2="580" y2="110"/>
    <text x="520" y="100">CARGO: MODULAR BULK BAYS</text>
    <line x1="180" y1="390" x2="100" y2="480"/>
    <text x="20" y="495">ENGINE: HEAVY CARGO DRIVES</text>
  </g>

</svg>