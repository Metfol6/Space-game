<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.22"/>
    </pattern>
    <linearGradient id="glowEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#060c18"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <rect x="25" y="25" width="1230" height="670" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="25" y1="65" x2="1255" y2="65" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="25" y1="655" x2="1255" y2="655" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>

  <text x="45" y="52" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="3">IMPERIAL FIELD SUPPORT BLUEPRINT // TACTICAL REPAIR TENDER</text>
  <text x="940" y="52" fill="#34d399" font-family="monospace" font-size="14" letter-spacing="1">CLASS: MOBILE NANO-REPAIR TENDER MK.V</text>
  <text x="45" y="680" fill="#94a3b8" font-family="monospace" font-size="12">SYS_SPEC: 5 SLOTS | NANO_REPAIR MATRIX &amp; DEFENSE AURA | SPEED: 3.5/H</text>
  <text x="1060" y="680" fill="#10b981" font-family="monospace" font-size="12">STATUS: FIELD-READY</text>

  <!-- Hajótest és szerviz dokk grafika -->
  <g transform="translate(140, 150)" stroke="#a7f3d0" stroke-width="2" fill="none" filter="url(#neonGlow)">
    <!-- Fő törzs -->
    <polygon points="80,190 220,120 700,110 820,150 880,205 820,260 700,290 220,280 80,210" stroke="#10b981" stroke-width="2.8" fill="#06221c" fill-opacity="0.75"/>
    
    <!-- Központi Nano-Rezgődokk szerelő öböl -->
    <rect x="340" y="145" width="340" height="110" rx="8" stroke="#34d399" stroke-width="2.5" fill="#047857" fill-opacity="0.35"/>
    <line x1="340" y1="200" x2="680" y2="200" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- Szerelőkarok és nanit sugárzók -->
    <path d="M 400 145 L 370 85 L 430 65" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="430" cy="65" r="7" stroke="#06b6d4" stroke-width="2" fill="#22d3ee"/>
    
    <path d="M 520 145 L 520 75 L 570 55" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="570" cy="55" r="7" stroke="#06b6d4" stroke-width="2" fill="#22d3ee"/>
    
    <path d="M 400 255 L 370 315 L 430 335" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="430" cy="335" r="7" stroke="#06b6d4" stroke-width="2" fill="#22d3ee"/>
    
    <path d="M 520 255 L 520 325 L 570 345" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="570" cy="345" r="7" stroke="#06b6d4" stroke-width="2" fill="#22d3ee"/>

    <!-- Kvantum védőháló sugárzó gömb -->
    <circle cx="760" cy="200" r="28" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" fill="#064e3b" fill-opacity="0.6"/>
    <circle cx="760" cy="200" r="14" stroke="#34d399" stroke-width="2.5" fill="#10b981"/>

    <!-- Parancsnoki híd és triage radar -->
    <polygon points="620,110 680,85 710,110" stroke="#34d399" stroke-width="2" fill="#047857"/>
    <line x1="680" y1="85" x2="680" y2="45" stroke="#34d399" stroke-width="2"/>
    <circle cx="680" cy="45" r="6" stroke="#34d399" stroke-width="2" fill="#6ee7b7"/>

    <!-- Tolóművek -->
    <rect x="50" y="150" width="40" height="30" stroke="#06b6d4" stroke-width="2" fill="#083344"/>
    <rect x="50" y="220" width="40" height="30" stroke="#06b6d4" stroke-width="2" fill="#083344"/>
    <polygon points="50,165 10,165 30,155" stroke="#38bdf8" stroke-width="1.5" fill="#38bdf8" fill-opacity="0.8"/>
    <polygon points="50,235 10,235 30,225" stroke="#38bdf8" stroke-width="1.5" fill="#38bdf8" fill-opacity="0.8"/>

    <!-- Taktikai koordináta mutatók -->
    <circle cx="430" cy="65" r="16" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="570" cy="55" r="16" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
</svg>
