<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.22"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070d1a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <rect x="25" y="25" width="1230" height="670" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="25" y1="65" x2="1255" y2="65" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="25" y1="655" x2="1255" y2="655" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>

  <text x="45" y="52" fill="#00f3ff" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="3">IMPERIAL FLEET SUPPORT CAD SCHEMATIC // SIDE ELEVATION</text>
  <text x="960" y="52" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="1">CLASS: DRONE CARRIER CRUISER MK.VII</text>
  <text x="45" y="680" fill="#94a3b8" font-family="monospace" font-size="12">SCALE: 1:110 | SYS_SPEC: 5 SLOTS | DRONE_DEFENSE & FLEET_FLAK | SPEED: 3.0/H</text>
  <text x="1080" y="680" fill="#00f3ff" font-family="monospace" font-size="12">STATUS: SQUADRON-ACTIVE</text>

  
  <g transform="translate(120, 140)" stroke="#e0f2fe" stroke-width="2" fill="none" filter="url(#neonGlow)">
    <polygon points="60,200 200,130 680,120 840,160 900,210 840,260 680,290 200,280 60,220" stroke="#38bdf8" stroke-width="2.8" fill="#08172c" fill-opacity="0.7"/>
    <rect x="360" y="160" width="320" height="90" rx="6" stroke="#00f3ff" stroke-width="2.5" fill="#0284c7" fill-opacity="0.35"/>
    <line x1="360" y1="205" x2="680" y2="205" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="6,4"/>
    <polygon points="700,180 725,170 735,180 725,190" stroke="#38bdf8" stroke-width="1.5" fill="#0284c7"/>
    <polygon points="720,215 745,205 755,215 745,225" stroke="#38bdf8" stroke-width="1.5" fill="#0284c7"/>
    <polygon points="750,185 775,175 785,185 775,195" stroke="#38bdf8" stroke-width="1.5" fill="#0284c7"/>
    <polygon points="420,120 520,90 560,120" stroke="#00f3ff" stroke-width="2" fill="#0369a1"/>
    <line x1="520" y1="90" x2="520" y2="50" stroke="#00f3ff" stroke-width="2"/>
    <circle cx="520" cy="50" r="6" stroke="#00f3ff" stroke-width="2" fill="#38bdf8"/>
    <circle cx="320" cy="145" r="12" stroke="#38bdf8" stroke-width="2" fill="#075985"/>
    <circle cx="320" cy="265" r="12" stroke="#38bdf8" stroke-width="2" fill="#075985"/>
    <rect x="20" y="145" width="65" height="35" rx="3" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <rect x="10" y="190" width="75" height="40" rx="3" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <rect x="20" y="240" width="65" height="35" rx="3" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <polygon points="20,152 -15,162 20,172" fill="url(#glowCyan)" stroke="none"/>
    <polygon points="10,200 -30,210 10,220" fill="url(#glowCyan)" stroke="none"/>
    <polygon points="20,248 -15,258 20,268" fill="url(#glowCyan)" stroke="none"/>
  </g>

  
  <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" font-family="monospace" font-size="11" fill="#7dd3fc">
    <line x1="890" y1="330" x2="990" y2="290"/>
    <text x="960" y="280">WEAPON: DRONE LAUNCH DECK</text>
    <line x1="640" y1="190" x2="640" y2="90"/>
    <text x="580" y="80">AVIONICS: DRONE SWARM ECM MESH</text>
    <line x1="130" y1="350" x2="60" y2="450"/>
    <text x="10" y="465">ENGINE: VECTOR CRUISE ARRAY</text>
  </g>

</svg>