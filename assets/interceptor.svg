<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.22"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070d1a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <rect x="25" y="25" width="1230" height="670" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="25" y1="65" x2="1255" y2="65" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="25" y1="655" x2="1255" y2="655" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>

  <text x="45" y="52" fill="#00f3ff" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="3">IMPERIAL NAVY CAD SCHEMATIC // SIDE PROFILE</text>
  <text x="960" y="52" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="1">CLASS: INTERCEPTOR MK.IV</text>
  <text x="45" y="680" fill="#94a3b8" font-family="monospace" font-size="12">SCALE: 1:50 | SYS_SPEC: 4 SLOTS | LIGHTNING_STRIKE | SPEED: 10.0/H</text>
  <text x="1080" y="680" fill="#00f3ff" font-family="monospace" font-size="12">STATUS: COMBAT-READY</text>

  
  <g transform="translate(180, 160)" stroke="#e0f2fe" stroke-width="2" fill="none" filter="url(#neonGlow)">
    <polygon points="120,200 240,165 480,155 640,140 760,175 760,225 640,260 480,245 240,235" stroke="#38bdf8" stroke-width="2.5" fill="#0b1b36" fill-opacity="0.6"/>
    <path d="M 760 175 L 860 195 L 870 200 L 860 205 L 760 225 Z" stroke="#00f3ff" stroke-width="2" fill="#0284c7" fill-opacity="0.3"/>
    <line x1="870" y1="200" x2="910" y2="200" stroke="#00f3ff" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="560,145 660,140 680,165 570,170" stroke="#00f3ff" stroke-width="2" fill="#38bdf8" fill-opacity="0.4"/>
    <path d="M 380 155 L 280 80 L 460 110 L 520 150" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 380 245 L 280 320 L 460 290 L 520 250" stroke="#38bdf8" stroke-width="2"/>
    <rect x="440" y="72" width="90" height="8" rx="2" stroke="#00f3ff" stroke-width="1.5" fill="#0369a1"/>
    <rect x="440" y="320" width="90" height="8" rx="2" stroke="#00f3ff" stroke-width="1.5" fill="#0369a1"/>
    <rect x="100" y="160" width="60" height="35" rx="4" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <rect x="100" y="205" width="60" height="35" rx="4" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <polygon points="100,165 20,177 100,190" fill="url(#glowCyan)" stroke="none"/>
    <polygon points="100,210 20,222 100,235" fill="url(#glowCyan)" stroke="none"/>
    <circle cx="500" cy="200" r="20" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  
  <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" font-family="monospace" font-size="11" fill="#7dd3fc">
    <line x1="1050" y1="360" x2="1130" y2="360"/>
    <text x="1030" y="345">WEAPON: PLASMACANNON</text>
    <line x1="260" y1="360" x2="160" y2="480"/>
    <text x="70" y="495">ENGINE: AFTERBURNER ARRAY</text>
    <line x1="680" y1="360" x2="680" y2="470"/>
    <text x="610" y="490">HULL: COMPACT TITANIUM</text>
  </g>

</svg>