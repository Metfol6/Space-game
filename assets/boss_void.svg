<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#6b21a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetVoid" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#581c87"/>
      <stop offset="80%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="#020617"/>
  <!-- Space Stars -->
  <g fill="#c084fc" opacity="0.7">
    <circle cx="60" cy="50" r="1.5"/><circle cx="150" cy="80" r="1.2"/><circle cx="510" cy="70" r="1.5"/><circle cx="460" cy="130" r="1"/>
    <circle cx="90" cy="270" r="1.2"/><circle cx="530" cy="290" r="1.5"/><circle cx="210" cy="40" r="1.5"/><circle cx="390" cy="320" r="1.2"/>
  </g>
  <!-- Void Singularity Aura -->
  <circle cx="300" cy="180" r="190" fill="url(#voidGlow)"/>
  
  <!-- Swirling Singularity Rings -->
  <ellipse cx="300" cy="180" rx="230" ry="70" fill="none" stroke="rgba(192,132,252,0.4)" stroke-width="2" stroke-dasharray="8,8" transform="rotate(-15 300 180)"/>
  <ellipse cx="300" cy="180" rx="210" ry="60" fill="none" stroke="rgba(168,85,247,0.7)" stroke-width="3" transform="rotate(25 300 180)"/>
  
  <!-- Planet Core -->
  <circle cx="300" cy="180" r="100" fill="url(#planetVoid)"/>
  
  <!-- Dark Matter Singularity Rift Center -->
  <circle cx="300" cy="180" r="30" fill="#090514" stroke="#d8b4fe" stroke-width="2"/>
  <circle cx="300" cy="180" r="12" fill="#d8b4fe" opacity="0.9"/>
  
  <!-- Titan Railgun Spires -->
  <g stroke="#e9d5ff" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="70" x2="300" y2="40"/>
    <line x1="300" y1="290" x2="300" y2="320"/>
    <line x1="190" y1="180" x2="160" y2="180"/>
    <line x1="410" y1="180" x2="440" y2="180"/>
  </g>
  
  <text x="300" y="325" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">VOID CITADEL // ÜRESSÉG CITADELLÁJA</text>
  <text x="300" y="345" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">ENDGAME TIER 4 CITADELLA • SÖTÉT ANYAG SZINGULARITÁS</text>
</svg>