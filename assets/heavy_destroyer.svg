<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.22"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070d1a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <rect x="25" y="25" width="1230" height="670" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="25" y1="65" x2="1255" y2="65" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="25" y1="655" x2="1255" y2="655" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>

  <text x="45" y="52" fill="#00f3ff" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="3">IMPERIAL SIEGE CORPS CAD SCHEMATIC // SIDE ELEVATION</text>
  <text x="960" y="52" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="1">CLASS: HEAVY SIEGE DESTROYER MK.VIII</text>
  <text x="45" y="680" fill="#94a3b8" font-family="monospace" font-size="12">SCALE: 1:120 | SYS_SPEC: 5 SLOTS | 3X SIEGE_DMG & FRAGILE_SHIELD | SPEED: 2.4/H</text>
  <text x="1080" y="680" fill="#00f3ff" font-family="monospace" font-size="12">STATUS: SIEGE-ACTIVE</text>

  
  <g transform="translate(120, 140)" stroke="#e0f2fe" stroke-width="2" fill="none" filter="url(#neonGlow)">
    <polygon points="60,200 220,120 700,100 860,170 920,220 860,280 700,310 220,290 60,240" stroke="#38bdf8" stroke-width="3" fill="#08172e" fill-opacity="0.75"/>
    <rect x="520" y="55" width="280" height="35" rx="4" stroke="#00f3ff" stroke-width="2.5" fill="#0284c7" fill-opacity="0.5"/>
    <line x1="780" y1="65" x2="920" y2="65" stroke="#00f3ff" stroke-width="3"/>
    <line x1="780" y1="80" x2="920" y2="80" stroke="#00f3ff" stroke-width="3"/>
    <circle cx="550" cy="90" r="18" stroke="#00f3ff" stroke-width="2" fill="#0369a1"/>
    <polygon points="320,140 460,130 520,170 380,180" stroke="#38bdf8" stroke-width="2" fill="#0369a1" fill-opacity="0.4"/>
    <polygon points="320,270 460,280 520,240 380,230" stroke="#38bdf8" stroke-width="2" fill="#0369a1" fill-opacity="0.4"/>
    <ellipse cx="680" cy="205" rx="16" ry="22" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" fill="#0ea5e9" fill-opacity="0.2"/>
    <rect x="20" y="150" width="70" height="110" rx="5" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <polygon points="20,165 -30,205 20,245" fill="url(#glowCyan)" stroke="none"/>
  </g>

  
  <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" font-family="monospace" font-size="11" fill="#7dd3fc">
    <line x1="1040" y1="200" x2="1130" y2="170"/>
    <text x="1010" y="155">WEAPON: DUAL SIEGE MAULER BATTERY</text>
    <line x1="800" y1="350" x2="890" y2="450"/>
    <text x="820" y="465">SHIELD: VULNERABLE LOW-OUTPUT DOME</text>
    <line x1="130" y1="345" x2="60" y2="450"/>
    <text x="10" y="465">HULL: REINFORCED 950HP TITAN PLATE</text>
  </g>

</svg>