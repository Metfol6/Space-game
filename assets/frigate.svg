<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.22"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070d1a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <rect x="25" y="25" width="1230" height="670" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="25" y1="65" x2="1255" y2="65" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="25" y1="655" x2="1255" y2="655" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>

  <text x="45" y="52" fill="#00f3ff" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="3">IMPERIAL COMBAT CAD SCHEMATIC // SIDE ELEVATION</text>
  <text x="960" y="52" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="1">CLASS: TORPEDO FRIGATE MK.V</text>
  <text x="45" y="680" fill="#94a3b8" font-family="monospace" font-size="12">SCALE: 1:75 | SYS_SPEC: 5 SLOTS | SHIELD_PIERCE_TORPEDO | SPEED: 4.5/H</text>
  <text x="1080" y="680" fill="#00f3ff" font-family="monospace" font-size="12">STATUS: STEALTH-ARMED</text>

  
  <g transform="translate(150, 160)" stroke="#e0f2fe" stroke-width="2" fill="none" filter="url(#neonGlow)">
    <polygon points="100,190 260,150 550,140 780,180 880,200 780,230 550,260 260,250 100,210" stroke="#38bdf8" stroke-width="2.5" fill="#0c1a30" fill-opacity="0.65"/>
    <line x1="260" y1="150" x2="780" y2="200" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="260" y1="250" x2="780" y2="200" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="550" y1="140" x2="550" y2="260" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="740" y="170" width="50" height="12" rx="2" stroke="#00f3ff" stroke-width="2" fill="#0284c7"/>
    <rect x="740" y="218" width="50" height="12" rx="2" stroke="#00f3ff" stroke-width="2" fill="#0284c7"/>
    <line x1="790" y1="176" x2="840" y2="176" stroke="#00f3ff" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="790" y1="224" x2="840" y2="224" stroke="#00f3ff" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="480,140 540,115 580,140" stroke="#38bdf8" stroke-width="2" fill="#0369a1"/>
    <rect x="60" y="175" width="60" height="50" rx="3" stroke="#00f3ff" stroke-width="2" fill="#0f172a"/>
    <polygon points="60,185 10,200 60,215" fill="url(#glowCyan)" stroke="none"/>
  </g>

  
  <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" font-family="monospace" font-size="11" fill="#7dd3fc">
    <line x1="930" y1="355" x2="1030" y2="320"/>
    <text x="1000" y="310">WEAPON: QUANTUM TORPEDO TUBES</text>
    <line x1="650" y1="280" x2="650" y2="130"/>
    <text x="600" y="120">AVIONICS: TORPEDO TRACKING MAST</text>
    <line x1="200" y1="360" x2="110" y2="460"/>
    <text x="40" y="475">ENGINE: STEALTH ION THRUSTER</text>
  </g>

</svg>